# Registri, elenchi, opt-out di dispositivo e autorità di controllo.
# Non è consulenza legale. Nessun dato di persona fisica e nessun numero di telefono.
# Le email presenti sono caselle istituzionali di ruolo, lette su pagine ufficiali.
# complaint_url_verified false: la URL è la home o un ingresso da controllare, non un modulo già provato.
version: 0.2.0
updated: '2026-10-27'
disclaimer: Non è consulenza legale. I nominativi delle persone fisiche pubblicati dall'EDPB non vanno
  copiati in questo repo.
edpb_members: https://www.edpb.europa.eu/about-edpb/about-edpb/members_en
opposition_registers:
- id: rpo-it
  name: Registro Pubblico delle Opposizioni
  country: IT
  kind: opposition-register
  url: https://registrodelleopposizioni.it/cittadino/
  notes: 'Dal 2022 copre fissi e cellulari, anche non in elenco, e le chiamate automatiche. L''iscrizione
    annulla i consensi al telemarketing dati prima, tranne quelli dati dopo e i contratti continuativi
    (telefono, luce, gas). Non copre SMS, email, chat né i call center abusivi o esteri. Non sostituisce
    la revoca dell''elenco presso l''operatore. L''utente agisce dal proprio numero. I numeri del servizio
    stanno sulla pagina cittadino e non sono copiati qui.'
  channels:
  - id: web
    url: https://cittadino.registrodelleopposizioni.it/autenticazione/iscrizione/
    notes: SPID, CIE oppure senza autenticazione, secondo il modulo. Poi il sito chiede una chiamata di
      verifica dal numero da iscrivere. Non chiedere mai la password SPID o il PIN della CIE.
  - id: phone
    url: https://registrodelleopposizioni.it/cittadino/
    notes: Si chiama dal numero da iscrivere il numero pubblicato sulla pagina per le utenze fisse oppure
      quello per i cellulari. Non trascrivere quei numeri nel repo, in chat di log o in una issue.
  - id: pdf-email
    form_url: https://registrodelleopposizioni.it/wp-content/uploads/2022/07/RPO_Modulo_Email_ISCRIZIONE.pdf
    submission_email: iscrizione@registrodelleopposizioni.it
    notes: Modulo PDF ufficiale. Va salvato senza cambiare formato e inviato a questa casella istituzionale.
      L'iscrizione si completa con una chiamata di verifica dal numero, entro il tempo indicato nelle
      istruzioni che arrivano via email.
directories:
- id: elenchi-operatore
  name: Revoca dell'inserimento negli elenchi telefonici
  country: IT
  kind: directory-opt-out
  url: null
  notes: Si chiede al proprio operatore telefonico, non al RPO. Il bot prepara la bozza con templates/letters/it/revoca-consensi-operatore.md
    e invia solo dopo un sì esplicito. Non elencare qui URL di operatori non riverificati.
- id: paginebianche
  name: PagineBianche
  country: IT
  kind: directory
  url: https://www.paginebianche.it/
  automated_check:
    date: '2026-10-27'
    http_status: 403
    result: warning
  notes: Elenco da consultare nel browser dell'utente. Il controllo automatico ha ricevuto 403. Se la
    scheda c'è, la rimozione passa dall'operatore e, se serve, dal titolare dell'elenco. Non salvare la
    scheda nel repo.
search_delisting:
- id: google-rtbf
  name: Modulo Google sul diritto all'oblio
  kind: search-delisting
  url: https://reportcontent.google.com/forms/rtbf
  notes: Riguarda il risultato di ricerca, non la scheda alla fonte. Usalo dopo la richiesta al titolare
    della pagina, o insieme, se l'utente è d'accordo. Il modulo lo compila l'utente.
