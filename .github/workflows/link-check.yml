name: Link check

on:
  workflow_dispatch:
  schedule:
    # Monthly, on the first day. 403 is a warning inside the script; 404 fails the job.
    - cron: "17 8 1 * *"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_repo.py

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Check data URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_links.py ${{ github.event_name == 'schedule' && '--open-issue' || '' }}
